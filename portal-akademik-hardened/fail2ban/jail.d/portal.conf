# Jail Fail2ban untuk Portal Akademik  -> fix T3 (brute force) lapisan jaringan.
# Melengkapi regulation bawaan Authelia (ban di lapisan IAM).

[DEFAULT]
bantime  = 1800
findtime = 300
maxretry = 5
banaction = iptables-allports

[portal-auth]
enabled  = true
filter   = portal-auth
logpath  = /var/log/portal/app.log
maxretry = 5
findtime = 300
bantime  = 1800

# Ban IP yang berulang kali ditolak Authelia / WAF (HTTP 401/403) di akses nginx.
[portal-nginx-401]
enabled  = true
port     = http,https
filter   = nginx-http-auth
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 120
bantime  = 1800
