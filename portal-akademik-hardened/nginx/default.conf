# =====================================================================
#  Nginx Reverse Proxy - Portal Akademik (AFTER HARDENING)
#  Rantai: Internet -> [proxy TLS+Authelia] -> [WAF ModSecurity] -> app -> db
#   - TLS/HTTPS + redirect 80->443        -> fix T7 (data in transit)
#   - Security headers + server_tokens off -> fix T8
#   - Forward-auth Authelia (SSO + MFA)    -> fix T3, perkuat T6 (IAM/Zero Trust PEP)
# =====================================================================

server {
    listen 80;
    server_name portal.local localhost;
    return 301 https://$host$request_uri;      # paksa HTTPS
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.local localhost;
    server_tokens off;                          # fix T8 (sembunyikan versi)

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # ---- Security headers (fix T8 + hardening) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options           "DENY" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy    "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;

    # ---- Endpoint verifikasi internal Authelia ----
    include /etc/nginx/snippets/authelia-location.conf;

    # ---- Portal Authelia (halaman login + MFA) di /authelia ----
    location ^~ /authelia {
        proxy_pass http://authelia:9091;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-URI    $request_uri;
    }

    # ---- Area admin: wajib MFA (two_factor di policy Authelia) ----
    location = /admin.php {
        include /etc/nginx/snippets/authelia-authrequest.conf;
        proxy_pass http://waf:8080;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    # ---- Seluruh aplikasi: lewat WAF, dilindungi Authelia (one_factor) ----
    location / {
        include /etc/nginx/snippets/authelia-authrequest.conf;
        proxy_pass http://waf:8080;
        include /etc/nginx/snippets/proxy-backend.conf;
    }
}
