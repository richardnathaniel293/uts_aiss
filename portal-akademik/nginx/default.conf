# =====================================================================
#  Nginx Reverse Proxy - Portal Akademik
#  Versi: BEFORE HARDENING
#  - Hanya HTTP (belum TLS)          -> Data in Transit tidak terenkripsi
#  - Tanpa security headers          -> ditambah saat hardening
#  - Tanpa ModSecurity WAF           -> ditambah saat hardening
#  - Menampilkan versi server        -> Information Disclosure
# =====================================================================

upstream portal_app {
    server app:80;
}

server {
    listen 80;
    server_name _;

    # [VULN] server_tokens on (default) membocorkan versi nginx.
    # Saat hardening: server_tokens off;

    location / {
        proxy_pass         http://portal_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Placeholder yang diaktifkan saat HARDENING ---
    #  * redirect 80 -> 443 (TLS)
    #  * ssl_certificate / ssl_certificate_key
    #  * add_header Strict-Transport-Security, X-Frame-Options, X-Content-Type-Options,
    #    Content-Security-Policy, Referrer-Policy
    #  * modsecurity on; modsecurity_rules_file /etc/nginx/modsec/main.conf;
    #  * forward-auth ke Authelia:  auth_request /authelia;
}
